services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://mediassure:mediassure@db:5432/mediassure
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  notification-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.notification_worker"]
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.example
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://mediassure:mediassure@db:5432/mediassure
      EMAIL_PREVIEW_DIR: /app/email_previews
    volumes:
      - email_previews:/app/email_previews
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mediassure
      POSTGRES_USER: mediassure
      POSTGRES_PASSWORD: mediassure
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediassure -d mediassure"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  email_previews:

